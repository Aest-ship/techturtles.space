  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">

<body>
  <div class="wrap">
    <header>
      <a class="logo" href="index.html">Tech Turtles</a>
      <nav aria-label="Main">
        <a href="index.html#start">Start here</a>
        <a href="index.html#library">Library</a>
        <a href="showcase.html" aria-current="page">Showcase</a>
        <a href="submit.html">Post your idea</a>
      </nav>
    </header>
  </div>
  <main class="band">
    <div class="wrap">
      <h1>Inventor showcase</h1>
      <p>Projects and papers from the community. Approved posts are visible to everyone; your own pending posts are visible when you sign in.</p>
      <p><a class="btn" href="submit.html">Share your invention</a></p>
      <div class="auth" id="auth-box" hidden>
        <p id="auth-msg"></p>
        <form id="signin-form" class="plain">
          <label>Email<input type="email" name="email" required autocomplete="email"></label>
          <button class="btn" type="submit">Email me a sign-in link</button>
        </form>
        <button class="btn alt" id="signout-btn" type="button" hidden>Sign out</button>
        <p id="auth-status" role="status"></p>
      </div>
      <div class="grid" id="grid"></div>
      <p id="showcase-status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <footer><div class="wrap">Tech Turtles · techturtles.space · Made for curious builders.</div></footer>
